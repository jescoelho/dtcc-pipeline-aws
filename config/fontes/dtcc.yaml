# Contrato da fonte DTCC PPD (relatório Cumulative, classe Rates).
#
# Fonte única de verdade pro que hoje identifica ESTA fonte, em vez de
# estar cravado em Python (lambda/unzip_dtcc.py, lambda/quality_check.py,
# glue/bronze_ingest.py) e em Terraform (main.tf, lambda.tf) ao mesmo
# tempo. Passo 1 da generalização: o Terraform lê este arquivo
# (yamldecode) e distribui cada campo pra onde ele já era consumido --
# caminhos S3 pros argumentos do Glue job, pras variáveis de ambiente das
# Lambdas e pros filtros do S3/EventBridge; campos de regra de qualidade
# pra novos argumentos do Glue job, que monta o ruleset DQDL em runtime
# (ver _montar_ruleset em glue/bronze_ingest.py) em vez de ter a string
# inteira cravada no script.
#
# Adicionar uma fonte nova hoje significa: um arquivo como este +
# duplicar os recursos do Terraform (ainda não é um módulo reutilizável
# -- isso é o passo 2, só vale a pena depois de existir uma segunda fonte
# de verdade pra validar contra). Script de ingestão (scripts/ingerir_cumulative.sh)
# e o próprio parsing do CSV (que depende da estrutura real de 110
# colunas do Cumulative) continuam fora deste contrato -- são específicos
# demais do DTCC pra generalizar sem uma segunda fonte real na mão.

nome: dtcc

# Layout no bucket -- onde o .zip chega, onde o unzip_dtcc.py escreve o
# .csv, onde o Glue escreve a Bronze em Parquet.
zip_prefix: raw/dtcc_zip/
raw_prefix: raw/dtcc/
bronze_prefix: bronze/dtcc/

# Fonte EXTERNA real do .zip -- até esta extensão era string cravada em
# scripts/ingerir_cumulative.sh (bucket público do DTCC, padrão de nome
# de arquivo), nunca no contrato. origem_padrao usa os mesmos placeholders
# que o script já recebe como argumento (classe do ativo, fonte regulatória,
# data): {fonte}, {fonte_upper}, {classe_ativo}, {data_underscore}.
origem_bucket: kgc0418-tdw-data-0
origem_padrao: "{fonte}/eod/{fonte_upper}_CUMULATIVE_{classe_ativo}_{data_underscore}.zip"
origem_classe_ativo_default: RATES
origem_fonte_default: cftc

# Regras de qualidade que o AWS Glue Data Quality avalia (ver
# glue/bronze_ingest.py) -- schema (colunas obrigatórias), identidade
# (completude + unicidade da coluna que identifica univocamente uma
# transação) e domínio (valores aceitos numa coluna categórica).
colunas_obrigatorias:
  - "Dissemination Identifier"
  - "Original Dissemination Identifier"
  - "Action type"
  - "Event timestamp"
coluna_id: "Dissemination Identifier"
unicidade_minima: 0.99
coluna_dominio: "Action type"
valores_dominio:
  - NEWT
  - MODI
  - CORR
  - TERM
  - EROR
  - REVI

# Comparação de volume contra o histórico (ver _media_historica em
# lambda/quality_check.py) -- o Glue Data Quality não cobre isso, só vê o
# arquivo de hoje isolado.
dias_historico: 7
queda_maxima_tolerada: 0.5

# Consistência sazonal: compara o volume de hoje contra o histórico do
# MESMO dia da semana (ex.: segunda-feira contra as `n` segundas
# anteriores), em vez de misturar todos os dias numa única média -- uma
# fonte com volume que varia previsivelmente por dia da semana (comum em
# dado financeiro: segunda após fim de semana, fim de mês/trimestre)
# não deveria disparar falso alerta só por isso. Cai automaticamente
# para a média simples (dias_historico/queda_maxima_tolerada acima)
# quando não houver ainda `semanas_historico_sazonal` ocorrências do
# mesmo dia da semana (pipeline recente) -- nunca fica sem checagem
# nenhuma por falta de dado sazonal.
#
# consistencia_sazonal: false desliga o método sazonal pra esta fonte
# (volta a usar só a média simples) -- parametrizável por fonte, não um
# interruptor global cravado no código.
consistencia_sazonal: true
semanas_historico_sazonal: 4

# Checagem agendada (não reativa a evento) de atualidade e linhagem --
# ver lambda/checar_pipeline.py e terraform/atualidade_linhagem.tf.
# janela_linhagem_dias: quantos dias de tabela de controle ler a cada
# execução (cobre o pior caso de "dia útil anterior" cair numa
# segunda-feira, 3 dias atrás contando o fim de semana).
# margem_linhagem_horas: quanto tempo esperar antes de considerar uma
# execução "deveria ter terminado" -- evita falso alerta numa execução
# ainda em andamento.
janela_linhagem_dias: 3
margem_linhagem_horas: 2

# As etapas que uma execução completa deve deixar na tabela de controle
# (campo "origem" de cada registro, ver lambda/checar_pipeline.py) --
# antes era uma lista fixa no Python, assumindo que toda fonte futura
# teria exatamente estas 4 etapas com estes nomes.
etapas_esperadas:
  - unzip_dtcc
  - glue_data_quality
  - glue_job
  - quality_check

# Agenda da checagem (ver terraform/atualidade_linhagem.tf) -- expressão
# cron nativa do EventBridge. 11h UTC / seg-sex: dá margem pro Glue e às
# duas Lambdas em paralelo terminarem de madrugada, e pula fim de semana
# porque o DTCC não publica nesses dias. Uma fonte com calendário
# diferente (ex.: publica todo dia, ou num fuso/horário diferente) só
# precisa trocar esta linha -- não é mais cravado no Terraform.
checagem_cron: "cron(0 11 ? * MON-FRI *)"

# Agenda da ingestão automatizada (ver lambda/ingerir_cumulative.py e
# terraform/ingestao_agendada.tf) -- busca o Cumulative do dia direto do
# bucket do DTCC, eliminando o passo manual que restava no pipeline
# (scripts/ingerir_cumulative.sh, rodado à mão). Precisa terminar bem
# antes de checagem_cron (acima), pra dar margem ao restante do fluxo
# (descompactar -> Glue -> checagem de qualidade) rodar antes da
# checagem de atualidade.
#
# Limite assumido: o horário real de publicação do Cumulative pelo DTCC
# não é documentado oficialmente -- 6h UTC é um ponto de partida (~5h de
# margem até checagem_cron), não um horário confirmado contra o
# comportamento real do DTCC ao longo de várias semanas. Ajustar depois
# de observar se o alerta de falha desta Lambda (arquivo ainda não
# publicado no horário) dispara com frequência.
ingestao_cron: "cron(0 6 ? * MON-FRI *)"
